name = "videosaverpro-gateway"
main = "cloudflare-worker.js"
compatibility_date = "2026-03-03"

[vars]
CORS_ORIGIN = "https://www.videosaverpro.online"
GATEWAY_RPM = "240"
# Set this to your backend API service URL in Cloudflare dashboard:
# API_ORIGIN = "https://videosaverpro-api-production.up.railway.app"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "replace_with_kv_namespace_id"
