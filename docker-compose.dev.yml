version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videosaverpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/videosaverpro
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8788
      JOB_QUEUE_NAME: video_jobs
      REQUESTS_PER_MINUTE: 300
      INSPECT_CACHE_TTL_SECONDS: 300
      SIGNED_URL_TTL_SECONDS: 3600
      REQUIRE_API_KEY: "false"
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./services/worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/videosaverpro
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_NAME: video_jobs
      WORKER_CONCURRENCY: 40
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
